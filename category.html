<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Saeed Ahmed — Work</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#0e0d14;color:#f7f3eb;font-family:'DM Sans',sans-serif}.container{width:min(1120px,90%);margin:auto}.nav{margin:10px auto;height:70px;border:2px solid #eeeae2;border-radius:40px;padding:0 24px;background:#191721;display:flex;align-items:center;justify-content:space-between;position:sticky;top:10px;z-index:5}.brand{color:#f5f0e8;text-decoration:none;display:flex;flex-direction:column;line-height:1}.brand strong{font:800 17px 'Space Grotesk'}.brand small{font:700 9px 'Space Grotesk';letter-spacing:1.2px;color:#9b83ff;margin-top:4px}.back{color:#ffc43d;text-decoration:none;font-weight:800}.hero{padding:100px 0 60px}.label{color:#a997ff;font:700 12px 'Space Grotesk';letter-spacing:2px}.hero h1{font:800 clamp(55px,8vw,100px)/.9 'Space Grotesk';letter-spacing:-5px;margin:22px 0}.hero h1 span{color:#7b57ff}.hero p{max-width:650px;color:#aaa6b5;font-size:18px}.filter{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.filter span{border:1px solid #403a4b;border-radius:30px;padding:8px 14px;color:#aaa6b5;font-size:12px}.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;padding-bottom:100px}.project{min-height:300px;border:2px solid #817d89;border-radius:24px;overflow:hidden;background:#191721;display:flex;flex-direction:column;justify-content:flex-end}.project .visual{height:235px;background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.2),transparent 35%),linear-gradient(145deg,#6f4eff,#21193f)}.project:nth-child(2n) .visual{background:linear-gradient(145deg,#ffc43d,#8d5c0e)}.project:nth-child(3n) .visual{background:linear-gradient(145deg,#ff765f,#5a221a)}.project-info{padding:18px 20px}.project-info small{color:#a997ff;font:700 10px 'Space Grotesk';letter-spacing:1.5px}.project-info h2{font:700 20px 'Space Grotesk';margin:6px 0}.project-info p{color:#aaa6b5;font-size:13px;margin:0}@media(max-width:800px){.projects{grid-template-columns:1fr 1fr}}@media(max-width:560px){.projects{grid-template-columns:1fr}.hero{padding-top:70px}.hero h1{letter-spacing:-3px}.nav{height:62px}.brand strong{font-size:15px}}</style></head><body><nav class="nav"><a class="brand" href="index.html"><strong>SAEED AHMED</strong><small>GRAPHIC & BRAND DESIGNER</small></a><a class="back" href="index.html#work">← Back to Work</a></nav><header class="container hero"><div class="label" id="label">02 / WORK</div><h1 id="title">LOGOS, PACKAGING<br><span>& CAMPAIGNS.</span></h1><p id="desc">A selection of Saeed Ahmed's design work, organised by discipline.</p><div class="filter" id="filter"></div></header><main class="container projects" id="projects"></main><script>const data={branding:{label:'01 / BRANDING',title:'LOGO & BRAND IDENTITY',desc:'Logo systems, visual identities, brand marks and identity applications.',items:['Jabeen Foods','GX Experience','Abu Turab Fragrance','Zariya','Padeel','Eviline Couture']},packaging:{label:'02 / PRODUCT',title:'PACKAGING DESIGN',desc:'Packaging concepts and product presentation designed to communicate clearly on shelf and screen.',items:['Product Packaging','Food Packaging','Perfume Packaging','Retail Packaging']},social:{label:'03 / DIGITAL',title:'SOCIAL MEDIA POST',desc:'Social media campaigns, promotional posts and digital marketing creatives.',items:['Campaign Creative','Social Media Post','Event Promotion','Digital Ad']},outdoor:{label:'04 / MARKETING',title:'OUTDOOR MARKETING & EVENT BRANDING',desc:'Large-format marketing, event branding, standees, backdrops, billboards and promotional materials.',items:['Billboard Design','Event Backdrop','Standee Design','Event Branding']},publishing:{label:'05 / PUBLISHING',title:'BOOKS & PUBLICATIONS',desc:'Book covers, layouts, publications and print-ready editorial design.',items:['Book Cover Design','Children’s Books','Research Publication','Journal Design']}};const type=new URLSearchParams(location.search).get('type')||'branding';const d=data[type]||data.branding;document.title='Saeed Ahmed — '+d.title;label.textContent=d.label;title.innerHTML=d.title.replace(' & ','<br><span>& </span>').replace('LOGO & BRAND IDENTITY','LOGO <span>& BRAND IDENTITY</span>');desc.textContent=d.desc;filter.innerHTML='<span>'+d.label.split('/')[1].trim()+'</span><span>Selected Work</span><span>Portfolio</span>';projects.innerHTML=d.items.map((x,i)=>`<article class="project"><div class="visual"></div><div class="project-info"><small>0${i+1} / ${d.label.split('/')[1].trim()}</small><h2>${x}</h2><p>Project preview — artwork will be added here.</p></div></article>`).join('');</script></body></html>
